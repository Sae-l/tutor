<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>tutor – README-Animation</title>
<!-- Quelle der README-Animation; render.mjs erzeugt daraus hero-light.gif und hero-dark.gif. -->
<style>
@font-face { font-family: "Source Serif 4"; font-weight: 200 900; src: url(../../fonts/source-serif-4-latin.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 200 800; src: url(../../fonts/atkinson-next-latin.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 200 800; src: url(../../fonts/atkinson-next-latin-ext.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF, U+2000-206F, U+2190-21FF; }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(../../fonts/jetbrains-mono-400.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(../../fonts/jetbrains-mono-500.woff2) format("woff2"); }
:root {
  --paper: #FAFAF9; --sheet: #FFFFFF; --ink: #1C1917; --pencil: #57534E; --hairline: #E7E5E4;
  --accent: #2F6F5E; --wash: #E8F1EE; --amber: #B45309; --grid-line: rgba(47,111,94,.07);
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
:root[data-theme="dark"] {
  --paper: #161412; --sheet: #1E1B19; --ink: #F5F5F4; --pencil: #A8A29E; --hairline: #2E2A27;
  --accent: #6FB39F; --wash: #1D2D28; --amber: #F59E0B; --grid-line: rgba(111,179,159,.06);
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 600px; overflow: hidden; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 32px 32px;
  display: grid; grid-template-columns: 500px 560px; gap: 56px; padding: 56px 42px; align-items: center;
}
.kicker { font: 500 15px var(--mono); color: var(--pencil); letter-spacing: .02em; }
h1 { font: 650 64px/1.02 var(--serif); letter-spacing: -.02em; margin: 16px 0 18px; }
h1 em { font-style: normal; color: var(--accent); }
.lead { font-size: 21px; line-height: 1.45; color: var(--pencil); max-width: 30ch; }
.steps { display: flex; gap: 10px; margin-top: 34px; }
.step { position: relative; font: 500 17px var(--mono); padding: 9px 15px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--sheet); color: var(--pencil); }
.step i { position: absolute; inset: -1px; border-radius: inherit; background: var(--accent); opacity: var(--w, 0); }
.step span { position: relative; }
.step.lock { border-style: dashed; }
.foot { margin-top: 22px; font: 400 14px var(--mono); color: var(--pencil); }

.card { position: relative; height: 488px; background: var(--sheet); border: 1px solid var(--hairline); border-radius: 22px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(28,25,23,.04), 0 12px 32px rgba(28,25,23,.07); overflow: hidden; }
.bar { display: flex; justify-content: space-between; font: 400 13px var(--mono); color: var(--pencil); }
.scene { position: absolute; left: 24px; right: 24px; top: 56px; }
.user { margin-left: 64px; background: var(--paper); border: 1px solid var(--hairline); border-radius: 16px; padding: 12px 16px; font-size: 17px; line-height: 1.4; }
.user code { display: inline-block; margin-top: 6px; font: 500 15px var(--mono); color: var(--accent); }
.user .cam { display: inline-block; width: 18px; height: 14px; margin-right: 6px; vertical-align: -1px; border: 2px solid var(--pencil); border-radius: 3px; position: relative; }
.user .cam::after { content: ""; position: absolute; left: 4px; top: 2px; width: 5px; height: 5px; border: 2px solid var(--pencil); border-radius: 50%; }
.t { margin-top: 14px; }
.h { font-weight: 700; font-size: 15px; color: var(--accent); margin-bottom: 4px; }
.p { font-size: 17px; line-height: 1.45; }
.eq { font: 400 23px var(--serif); text-align: center; margin: 6px 0 2px; }
.eq sup { font-size: .6em; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; font-size: .72em; line-height: 1; margin-right: 2px; }
.frac span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 2px 1px; }
ol.p { padding-left: 22px; }
ol.p li { margin: 2px 0; }
.lockline { margin-top: 14px; border: 1px dashed var(--hairline); border-radius: 12px; padding: 9px 14px; font-size: 15px; color: var(--pencil); }
.ok { color: var(--accent); font-weight: 700; }
.err { color: var(--amber); font-weight: 700; }
.mark { background: color-mix(in srgb, var(--amber) 18%, transparent); border-radius: 4px; padding: 0 3px; }
[data-in] { opacity: 0; }
</style>
</head>
<body>
<section>
  <p class="kicker">Physik · Mathe · E-Technik · Mechanik</p>
  <h1>Verstehen <em>statt</em> abschreiben.</h1>
  <p class="lead">Der Tutor erklärt, fragt nach und prüft deinen Rechenweg. Die Lösung kommt erst, wenn du sie willst.</p>
  <div class="steps">
    <div class="step" data-on="0 4"><i></i><span>erklär</span></div>
    <div class="step" data-on="4 8"><i></i><span>tipp</span></div>
    <div class="step" data-on="8 12"><i></i><span>check</span></div>
    <div class="step lock"><i></i><span>🔒 lösung</span></div>
  </div>
  <p class="foot">Claude-Skill · auch ChatGPT und Gemini (experimentell)</p>
</section>

<figure class="card" aria-label="Beispiel eines Lernverlaufs, gekürzt">
  <div class="bar"><span>Beispiel · gekürzt</span><span>tutor</span></div>

  <div class="scene">
    <div class="user" data-in="0.2" data-out="3.8"><span class="cam"></span>Ein Ball wird mit 12 m/s senkrecht nach oben geworfen. Wie hoch steigt er?<br><code>erklär</code></div>
    <div class="t" data-in="0.9" data-out="3.8"><p class="h">💡 Idee</p><p class="p">Beim Steigen wird der Ball langsamer, bis er oben kurz stillsteht. Seine Bewegungsenergie wird ganz zu Lageenergie.</p></div>
    <div class="t" data-in="1.6" data-out="3.8"><p class="h">📐 Gleichungen</p><p class="eq"><span class="frac"><span>1</span><span>2</span></span><i>mv</i><sup>2</sup> + <i>mgh</i> = konst.</p></div>
    <div class="t" data-in="2.3" data-out="3.8"><p class="h">🧩 Verständnisfrage</p><p class="p">Hängt die Steighöhe von der Masse des Balls ab?</p></div>
    <p class="lockline" data-in="2.8" data-out="3.8">🔒 Lösungen: mit „lösung“ abrufen</p>
  </div>

  <div class="scene">
    <div class="user" data-in="4.2" data-out="7.8"><code>tipp</code></div>
    <div class="t" data-in="4.9" data-out="7.8"><p class="h">❓ Leitfragen</p>
      <ol class="p">
        <li data-in="5.1" data-out="7.8">Welche Größe soll herauskommen, in welcher Einheit?</li>
        <li data-in="5.5" data-out="7.8">Wie schnell ist der Ball am höchsten Punkt?</li>
        <li data-in="5.9" data-out="7.8">Warum fällt die Masse am Ende heraus?</li>
      </ol>
    </div>
    <div class="t" data-in="6.5" data-out="7.8"><p class="h">➡️ Nächster Schritt</p><p class="p">Beantworte die Fragen auf Papier und schick mir deinen Rechenweg.</p></div>
    <p class="lockline" data-in="6.9" data-out="7.8">🔒 Lösungen: mit „lösung“ abrufen</p>
  </div>

  <div class="scene">
    <div class="user" data-in="8.2" data-out="11.6">Mein Weg: ½ <i>mv</i>² = <i>mgh</i>, also <span class="mark"><i>h</i> = <i>v</i>²/<i>g</i></span> = 14,7 m<br><code>check</code></div>
    <div class="t" data-in="8.9" data-out="11.6"><p class="h">🔍 Check</p>
      <p class="p"><span class="ok">Richtig:</span> Energieansatz und Kürzen der Masse.</p>
      <p class="p" style="margin-top:6px"><span class="err">Erster Fehler (Rechenfehler):</span> Beim Auflösen nach <i>h</i> ist der Faktor ½ verloren gegangen.</p>
    </div>
    <div class="t" data-in="9.7" data-out="11.6"><p class="eq"><i>h</i> = <span class="frac"><span><i>v</i><sup>2</sup></span><span>2<i>g</i></span></span></p></div>
    <div class="t" data-in="10.2" data-out="11.6"><p class="h">➡️ Nächster Schritt</p><p class="p">Rechne ab hier selbst weiter.</p></div>
    <p class="lockline" data-in="10.6" data-out="11.6">🔒 Lösungen: mit „lösung“ abrufen</p>
  </div>
</figure>

<script>
const T = 12; // Länge einer Schleife in Sekunden
const ease = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const params = new URLSearchParams(location.search);
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
const items = [...document.querySelectorAll("[data-in]")];
const steps = [...document.querySelectorAll("[data-on]")];
window.render = t => {
  for (const el of items) {
    const a = ease((t - el.dataset.in) / 0.35) * (1 - ease((t - el.dataset.out) / 0.3));
    el.style.opacity = a;
    el.style.transform = `translateY(${(1 - ease((t - el.dataset.in) / 0.35)) * 10}px)`;
  }
  for (const el of steps) {
    const [on, off] = el.dataset.on.split(" ").map(Number);
    const w = ease((t - on) / 0.3) * (1 - ease((t - off + 0.3) / 0.3));
    el.style.setProperty("--w", w);
    el.style.color = w > 0.5 ? "var(--sheet)" : "";
    el.style.borderColor = w > 0.5 ? "var(--accent)" : "";
  }
};
window.LOOP = T;
if (!params.has("render")) {
  const t0 = performance.now();
  const tick = now => { render(((now - t0) / 1000) % T); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
