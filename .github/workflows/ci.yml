name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-und-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build
        run: python build.py
      - name: dist/ entspricht dem Commit
        shell: bash
        run: |
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"
      - name: Strukturtests
        run: python -B -m unittest discover -s tests -v
      - name: Obsidian-Wissensbasis
        run: python -B Obsidian-tutor/verify_vault.py
      - name: Skill-Paket enthält nur Markdown-Dateien
        shell: bash
        run: |
          bad=$(git ls-tree -r --name-only HEAD tutor/ | grep -v '\.md$' || true)
          test -z "$bad" || { echo "Nicht erlaubte Dateien in tutor/: $bad"; exit 1; }
