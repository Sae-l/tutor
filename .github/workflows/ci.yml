name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-und-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build
        run: python build.py
      - name: dist/ entspricht dem Commit
        run: git diff --exit-code -- dist/
      - name: Strukturtests
        run: python -B -m unittest discover -s tests -v
      - name: Skill-Paket enthält nur Markdown-Dateien
        shell: bash
        run: |
          bad=$(git ls-tree -r --name-only HEAD tutor/ | grep -v '\.md$' || true)
          test -z "$bad" || { echo "Nicht erlaubte Dateien in tutor/: $bad"; exit 1; }
