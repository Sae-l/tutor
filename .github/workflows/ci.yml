name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-und-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Build
        run: python build.py
      - name: dist/ entspricht dem Commit
        run: git diff --exit-code -- dist/
      - name: Strukturtests
        run: python -B -m unittest discover -s tests -v
      - name: Skill-Paket enthält nur Markdown-Dateien
        shell: bash
        run: |
          bad=$(git ls-tree -r --name-only HEAD tutor/ | grep -v '\.md$' || true)
          test -z "$bad" || { echo "Nicht erlaubte Dateien in tutor/: $bad"; exit 1; }
